[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustforge-skills"
version = "0.6.0"
description = "Trust, verification, privacy and reliability primitives for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "TrustForge contributors"}]
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["ai-agents", "agent-skills", "verification", "reliability", "security", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
trustforge = "trustforge.cli:main"

[project.urls]
Repository = "https://github.com/ptrgiang/trustforge-skills"
Issues = "https://github.com/ptrgiang/trustforge-skills/issues"

[tool.setuptools.packages.find]
include = ["trustforge*"]
