name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CommitmentGuard smoke test
        run: trustforge verify examples/refactor-contract.json --evidence examples/refactor-evidence.json
      - name: DataLease smoke test
        run: |
          mkdir -p .artifacts
          trustforge datalease apply \
            --policy examples/datalease/support-policy.yaml \
            --purpose "send order summary to support tool" \
            --input examples/datalease/order-payload.json \
            --payload-only > .artifacts/datalease-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path(".artifacts/datalease-output.json").read_text())
          expected = json.loads(Path("examples/datalease/expected-payload.json").read_text())
          assert actual == expected
          print("DataLease smoke test passed")
          PY
      - name: DataLease interception smoke test
        run: |
          python examples/datalease/interceptor_demo.py > .artifacts/datalease-interceptor.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".artifacts/datalease-interceptor.json").read_text())
          assert result["http"]["destination"] == "support.example.com"
          assert result["mcp"]["destination"] == "mcp:support.create_ticket"
          assert "internal" not in result["http"]["sent_json"]
          assert result["http"]["sent_json"] == result["mcp"]["sent_arguments"]
          print("DataLease interception smoke test passed")
          PY
      - name: DataLease classifier benchmark gate
        run: |
          trustforge datalease benchmark \
            --dataset evals/datalease/classifier-benchmark.jsonl \
            --min-precision 0.90 \
            --min-recall 0.85 \
            > .artifacts/datalease-benchmark.json
      - name: DataLease multilingual/domain benchmark gate
        run: |
          trustforge datalease benchmark \
            --dataset evals/datalease/classifier-benchmark-multilingual.jsonl \
            --min-precision 0.90 \
            --min-recall 0.90 \
            > .artifacts/datalease-benchmark-multilingual.json
      - name: FreshPlan selective invalidation smoke test
        run: |
          trustforge freshplan check \
            --plan evals/freshplan/selective-invalidation/plan.yaml \
            --as-of "2026-09-11T09:30:00Z" \
            --json > .artifacts/freshplan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan.json").read_text())
          expected = json.loads(Path("evals/freshplan/selective-invalidation/expected.json").read_text())
          assert report["decision"] == "replan_required"
          for key in ("as_of", "stale_facts", "replan_order", "unaffected_nodes"):
              assert report[key] == expected[key], (key, report[key], expected[key])
          print("FreshPlan selective invalidation smoke test passed")
          PY
      - name: FreshPlan stale gate exit code
        run: |
          set +e
          trustforge freshplan check \
            --plan evals/freshplan/selective-invalidation/plan.yaml \
            --as-of "2026-09-11T09:30:00Z" \
            --fail-on-stale > /dev/null
          status=$?
          set -e
          test "$status" -eq 6
      - name: FreshPlan refresh request smoke test
        run: |
          trustforge freshplan requests \
            --plan evals/freshplan/replacement-patch/plan.yaml \
            --as-of "2026-09-11T09:30:00Z" \
            --json > .artifacts/freshplan-requests.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan-requests.json").read_text())
          assert report["decision"] == "refresh_required"
          assert report["summary"]["configured_requests"] == 1
          assert report["requests"][0]["fact_id"] == "inventory"
          assert report["requests"][0]["adapter"] == "inventory-api"
          print("FreshPlan refresh request smoke test passed")
          PY
      - name: FreshPlan replacement patch smoke test
        run: |
          trustforge freshplan patch \
            --plan evals/freshplan/replacement-patch/plan.yaml \
            --evidence evals/freshplan/replacement-patch/changed.json \
            --as-of "2026-09-11T09:30:00Z" \
            --json > .artifacts/freshplan-patch.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan-patch.json").read_text())
          assert report["decision"] == "replan_required"
          assert report["replan_order"] == ["reorder", "purchase"]
          assert report["unaffected_nodes"] == ["price"]
          assert [op["op"] for op in report["operations"]] == ["replan", "replan"]
          print("FreshPlan replacement patch smoke test passed")
          PY
      - name: FreshPlan adapter smoke test
        run: |
          python examples/freshplan/adapter_demo.py > .artifacts/freshplan-adapter.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan-adapter.json").read_text())
          assert report["decision"] == "replan_required"
          assert report["replan_order"] == ["reorder", "purchase"]
          print("FreshPlan adapter smoke test passed")
          PY
      - name: FreshPlan replan gate exit code
        run: |
          set +e
          trustforge freshplan patch \
            --plan evals/freshplan/replacement-patch/plan.yaml \
            --evidence evals/freshplan/replacement-patch/changed.json \
            --as-of "2026-09-11T09:30:00Z" \
            --fail-on-replan > /dev/null
          status=$?
          set -e
          test "$status" -eq 6
      - name: FreshPlan freshness-policy smoke test
        run: |
          trustforge freshplan check \
            --plan examples/freshplan/freshness-policies.yaml \
            --as-of "2026-09-11T09:30:00Z" \
            --json > .artifacts/freshplan-policy.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan-policy.json").read_text())
          assert report["decision"] == "refresh_recommended"
          assert report["refresh_due_facts"] == ["inventory"]
          assert report["stale_facts"] == []
          assert report["replan_order"] == []
          print("FreshPlan freshness policy smoke test passed")
          PY
      - name: FreshPlan large-graph benchmark gate
        run: |
          trustforge freshplan benchmark \
            --nodes 1000 5000 10000 \
            --repeats 2 \
            --max-median-ms 5000 \
            --json > .artifacts/freshplan-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/freshplan-benchmark.json").read_text())
          assert report["largest_case"]["nodes"] == 10000
          assert report["largest_case"]["invalidated_nodes"] == 1000
          print("FreshPlan large-graph benchmark gate passed")
          PY
      - name: ReproCapsule build smoke test
        run: |
          rm -rf .artifacts/reprocapsule
          trustforge reprocapsule build \
            --spec examples/reprocapsule/example-spec.yaml \
            --output .artifacts/reprocapsule \
            --json > .artifacts/reprocapsule-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/reprocapsule-report.json").read_text())
          manifest = json.loads(Path(".artifacts/reprocapsule/reprocapsule.json").read_text())
          trace = Path(".artifacts/reprocapsule/trace.txt").read_text()
          assert report == manifest
          assert report["expected_failure_signature"] == "AssertionError: missing required field"
          assert report["safety"]["command_executed_during_build"] is False
          assert report["safety"]["raw_environment_values_included"] is False
          assert report["trace"]["redactions"] >= 2
          assert "example-secret-value" not in trace
          assert "example-example-example-token" not in trace
          print("ReproCapsule build smoke test passed")
          PY
      - name: ReproCapsule integrity-only replay gate
        run: |
          trustforge reprocapsule replay \
            --capsule .artifacts/reprocapsule \
            --json > .artifacts/reprocapsule-ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/reprocapsule-ready.json").read_text())
          assert report["decision"] == "ready"
          assert report["executed"] is False
          assert report["integrity"]["decision"] == "verified"
          print("ReproCapsule integrity gate passed")
          PY
      - name: ReproCapsule replay verification gate
        run: |
          trustforge reprocapsule replay \
            --capsule .artifacts/reprocapsule \
            --execute \
            --fail-on-divergence \
            --json > .artifacts/reprocapsule-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/reprocapsule-replay.json").read_text())
          assert report["decision"] == "reproduced"
          assert report["executed"] is True
          assert report["return_code"] == 1
          assert report["exit_code_match"] is True
          assert report["failure_signature_match"] is True
          print("ReproCapsule replay verification gate passed")
          PY
      - name: ReproCapsule container export gate
        run: |
          rm -rf .artifacts/reprocapsule-container
          trustforge reprocapsule export-container \
            --capsule .artifacts/reprocapsule \
            --output .artifacts/reprocapsule-container \
            --json > .artifacts/reprocapsule-container-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".artifacts/reprocapsule-container-report.json").read_text())
          stored = json.loads(Path(".artifacts/reprocapsule-container/container-export.json").read_text())
          dockerfile = Path(".artifacts/reprocapsule-container/Dockerfile").read_text()
          devcontainer = json.loads(Path(".artifacts/reprocapsule-container/.devcontainer/devcontainer.json").read_text())
          assert report == stored
          assert report["decision"] == "exported"
          assert report["base_image"].startswith("python:")
          assert report["safety"]["integrity_verified_before_export"] is True
          assert report["safety"]["container_built_during_export"] is False
          assert report["safety"]["container_executed_during_export"] is False
          assert "USER repro" in dockerfile
          assert 'CMD ["python", "parser_demo.py", "fixtures/input.json"]' in dockerfile
          assert devcontainer["remoteUser"] == "repro"
          assert Path(".artifacts/reprocapsule-container/inputs/parser_demo.py").is_file()
          print("ReproCapsule container export gate passed")
          PY
      - name: ReproCapsule tamper block gate
        run: |
          cp -R .artifacts/reprocapsule .artifacts/reprocapsule-tampered
          printf '\n# tampered\n' >> .artifacts/reprocapsule-tampered/inputs/parser_demo.py
          set +e
          trustforge reprocapsule replay \
            --capsule .artifacts/reprocapsule-tampered \
            --execute > .artifacts/reprocapsule-tamper.txt
          status=$?
          set -e
          test "$status" -eq 7
          grep -q "Decision: blocked" .artifacts/reprocapsule-tamper.txt
          grep -q "Executed: no" .artifacts/reprocapsule-tamper.txt
      - name: Package development version consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import trustforge
          pyproject = Path("pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"$', pyproject, re.MULTILINE).group(1)
          assert version == "0.6.0.dev2"
          assert trustforge.__version__ == version
          print(f"development version consistent: {version}")
          PY

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local SkillDiff action
        uses: ./
        with:
          before: evals/skilldiff/python-ast-alias/before
          after: evals/skilldiff/python-ast-alias/after
          format: json
          report-path: .artifacts/skilldiff.json
      - name: Validate action report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.artifacts/skilldiff.json').read_text())
          assert report['schema_version'] == '0.3'
          assert 'python-ast-v1' in report['detectors']
          assert 'subprocess' in report['ast_analysis']['new_capabilities']
          print('SkillDiff composite action smoke test passed')
          PY
