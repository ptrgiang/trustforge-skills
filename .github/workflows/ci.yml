name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Shared preflight
        run: python scripts/preflight.py

  action-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local SkillDiff action
        uses: ./
        with:
          before: evals/skilldiff/python-ast-alias/before
          after: evals/skilldiff/python-ast-alias/after
          format: json
          report-path: .artifacts/skilldiff.json
      - name: Validate action report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.artifacts/skilldiff.json').read_text())
          assert report['schema_version'] == '0.3'
          assert 'python-ast-v1' in report['detectors']
          assert 'subprocess' in report['ast_analysis']['new_capabilities']
          print('SkillDiff composite action smoke test passed')
          PY
